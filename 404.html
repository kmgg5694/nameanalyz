    <script>
      function bindIntroUnmute(wrap, v) {
        if (!wrap || !v) return;
        v.controls = false;
        v.removeAttribute("controls");
        var bar = wrap.querySelector(".intro-overlay");
        if (!bar) {
          bar = document.createElement("div");
          bar.className = "intro-overlay";
          bar.innerHTML =
            '<button type="button" class="intro-media-btn intro-mute" aria-label="소리 켜기">' +
            '<svg class="ic-muted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>' +
            '<svg class="ic-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>' +
            "</button>";
          wrap.appendChild(bar);
        }
        var muteBtn = bar.querySelector(".intro-mute");
        function sync() {
          muteBtn.setAttribute("data-muted", v.muted ? "1" : "0");
          muteBtn.setAttribute("aria-label", v.muted ? "소리 켜기" : "음소거");
        }
        if (!muteBtn.getAttribute("data-wired")) {
          muteBtn.setAttribute("data-wired", "1");
          muteBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            v.muted = !v.muted;
            if (!v.muted && v.paused) {
              var p = v.play();
              if (p && p.catch) p.catch(function () {});
            }
            sync();
          });
        }
        if (!v.getAttribute("data-unmute-wired")) {
          v.setAttribute("data-unmute-wired", "1");
          v.addEventListener("volumechange", sync);
        }
        if (!wrap.getAttribute("data-unmute-obs")) {
          wrap.setAttribute("data-unmute-obs", "1");
          new MutationObserver(function () {
            bindIntroUnmute(wrap, document.getElementById("introVideo"));
          }).observe(wrap, { childList: true });
        }
        sync();
      }
      window.playIntro = function (lang) {
        lang = "ko";
        var file = "이름풀이_한국어단독.mp4";
        var wrap = document.getElementById("introPlayerWrap");
        var v = document.getElementById("introVideo");
        if (!wrap || !v) return false;
        bindIntroUnmute(wrap, v);
        v.muted = true;
        v.playsInline = true;
        v.setAttribute("playsinline", "");
        function start() {
          v.muted = true;
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
        }
        if (v.getAttribute("data-lang") !== lang) {
          v.setAttribute("data-lang", lang);
          v.src = "/nameanalyz/videos/" + encodeURIComponent(file);
          v.onloadeddata = start;
        } else {
          start();
        }
        return true;
      };
      (function startIntroOnOpen() {
        function tryStart() {
          if (window.__introStarted) return true;
          if (!window.playIntro("ko")) return false;
          window.__introStarted = true;
          return true;
        }
        if (tryStart()) return;
        var obs = new MutationObserver(function () {
          if (tryStart()) obs.disconnect();
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
