function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}

function lyInfo(y){const r=LD[y-LBASE];if(!r)return null;const n=r[1]?13:12;const bits=r[2].toString(2).padStart(n,'0');const months=[];let k=0,J=r[0]+2415000;for(let m=1;m<=12;m++){let len=bits[k++]==='1'?30:29;months.push({y,m,leap:false,len,start:J});J+=len;if(m===r[1]){len=bits[k++]==='1'?30:29;months.push({y,m,leap:true,len,start:J});J+=len;}}return{ny:r[0]+2415000,leap:r[1],months};}

function brRel(d,c,life){const t=[];let hap=false,bad=false;
 if(d===c){t.push('삼합(同)');hap=true;if([2,5,8,1,10,7].includes(c))t.push('삼형');if([4,6,9,11].includes(c))t.push('자형');}
 else{if(d%4===c%4){t.push('삼합');hap=true;}if((d+c)%12===1){t.push('육합');hap=true;}if(Math.floor(((d+10)%12)/3)===Math.floor(((c+10)%12)/3)){t.push('방합');hap=true;}
  const df=(c-d+12)%12;if(df===6||(d===4&&c===7)||(d===7&&c===4)){t.push('충');bad=true;}if(HYUNG.has(d+'-'+c)){t.push('형');bad=true;}if(PA.has(d+'-'+c)){t.push('파');bad=true;}if((d+c)%12===7){t.push('해');bad=true;}if(WONJIN.has(d+'-'+c)){t.push('원진');bad=true;}if(life&&(df===2||df===10)){t.push('격각');bad=true;}}
 // 합했다가 깨지는 경우(합+파: 寅亥·巳申) = 가장 흉
 if(hap&&t.includes('파')){const rest=t.filter(x=>x!=='육합'&&x!=='삼합'&&x!=='파');return{t:['합파'].concat(rest),v:-2,hapPa:true,both:false};}
 return{t,v:hap?1:(bad?-1:0),both:hap&&bad};}
function stemRel(d,c){const e1=STEM_EL[d],e2=STEM_EL[c];let t,v;if(e1===e2){t='比和';v=1;}else if((e1+1)%5===e2){t='我生';v=1;}else if((e2+1)%5===e1){t='生我';v=1;}else if((e1+2)%5===e2){t='我剋';v=-1;}else{t='剋我';v=-1;}
 const chung=Math.abs(d-c)===6&&STEM_EL[d]!==2;return{t:chung?'沖':t,v,label:v>0?'天干合':'天干沖剋'};}
function wxRel(lead,num){const e1=NUM_EL[lead],e2=NUM_EL[num];if(e1===e2)return{t:'比和',v:1};if((e1+1)%5===e2||(e2+1)%5===e1)return{t:'相生',v:1};return{t:'相剋',v:-1};}

function makePerson(inp){// inp:{name,sex,cal:'solar'|'lunar',leap,y,m,d,hh,mi}
 let sol,lun;if(inp.cal==='solar'){sol={y:inp.y,m:inp.m,d:inp.d};lun=solarToLunar(inp.y,inp.m,inp.d);if(!lun)return{err:'양력 날짜가 올바르지 않거나 지원 범위(1900~2050년)를 벗어났습니다.'};}
 else{sol=lunarToSolar(inp.y,inp.m,inp.d,inp.leap);if(!sol)return{err:inp.leap?'해당 연도에 그 윤달이 없거나 날짜가 올바르지 않습니다.':'음력 날짜가 올바르지 않습니다(작은달은 29일까지).'};lun={y:inp.y,m:inp.m,d:inp.d,leap:!!inp.leap};}
 const saju=calcSaju(sol.y,sol.m,sol.d,inp.hh,inp.mi);
 const lyIdx=((lun.y-4)%60+60)%60;// 음력 연도 간지
 const hB=saju.hIdx!=null?saju.hIdx%12:null;
 const base=m9(lun.m+lun.d+1);
 const lifeSum=(lyIdx%10+1)+(lyIdx%12+1)+(hB!=null?hB+1:0)+lun.m+lun.d;
 const lifeLead=m9(lifeSum);

function analyzeCell(P,lead,num,gzI,mode,age){const ds=P.saju.dIdx%10,db=P.saju.dIdx%12,yb=P.saju.yIdx%12;const s=gzI%10,b=gzI%12;

 const kAge=koreanAge(P,Q.lun.y);
 const cells=nums.map((n,i)=>{const gzI=(dIdx+((i-p0+12)%12))%60;const a=analyzeCell(P,P.lifeLead,n,gzI,'life',ranges[i][0]?ranges[i][0][0]:null);a.label=ranges[i].map(r=>r[0]+'~'+r[1]+'세').join(' · ');a.ranges=ranges[i];a.cur=ranges[i].some(r=>kAge>=r[0]&&kAge<=r[1]);return a;});

 const cells=nums.map((n,i)=>{const a=analyzeCell(P,lead,n,gzIdx(s0+i,i+2),'year',age);a.label='음력 '+(i+1)+'월';a.cur=curMonth===i+1;return a;});

function buildDay(P,sol,curB){const L=solarToLunar(sol.y,sol.m,sol.d);const lead=m9(L.m+L.d);const nums=makeGrid(P.base,lead);const J=jdn(sol.y,sol.m,sol.d);const dI=dayIdxOfJ(J);const s0=((dI%10%5)*2+2)%10;const age=koreanAge(P,L.y);
 const cells=nums.map((n,i)=>{const a=analyzeCell(P,lead,n,gzIdx(s0+i,i+2),'day',age);a.label=HOUR_LABEL[i];a.cur=curB===(i+2)%12;return a;});

function monthDays(P,mo){const out=[];for(let d=1;d<=mo.len;d++){const J=mo.start+d-1;const sol=fromJdn(J);const dI=dayIdxOfJ(J);const lead=m9(mo.m+d);const g=gradeOf(P.base,lead);const br=brRel(P.saju.dIdx%12,dI%12,false),st=stemRel(P.saju.dIdx%10,dI%10);let sc=GRADE_INFO[g].s+2*br.v+st.v;if(br.hapPa)sc=Math.min(sc,-3);out.push({d,sol,dI,lead,g,br,st,sc,mark:scoreMark(sc)});}return out;}

 {m:'오방산신 난동 — 두 사람의 열렬한 사랑이 갈등으로 온다. 마음만 바쁘고 실제 노력이 없으면 소득도 없고 건강 이상. 남에게서 결실을 보기엔 아직 이르다.',v:-2,it:[['','건강 조심, 의욕이 없어진다. 현 위치에서 안정을 확보하라',-1],['D:子丑','子·丑일생은 더 나쁘다',-1]]},
 {m:'의욕이 없어진다. 현 위치에서 안정을 지키고 절대 욕심 내지 마라, 건강 유념. 여기저기 손대거나 일을 벌이면 안 된다.',v:-2,it:[]},
 {m:'승진·문서가 오니 강하게 추구하던 바를 이룬다. 확고한 신념으로 목표를 좇으면 성취감.',v:1,it:[['H','합이면 시험 합격·승진',2],['D:午未','午·未일생은 다르게 본다(충)',-1],['','행운의 숫자',1]]}],
'52':[
 {m:'변동으로 정신적 갈등, 건강 주의. 이성 간 새 관계가 시작되고 사업가는 동반자를 구할 수 있다. 다만 가치 기준 없는 변화는 연인·부부 불화, 가족과 이별.',v:-1,it:[['','안정해야 한다 — 7 건강 주의',-1],['','보이스피싱·보험 관재·유산 상속 관재',-1]]},
 {m:'교통사고, 외부로 인한 사고. 문서나 변화는 금물. 상문이 드니 상갓집 금물. 분별력이 흐려 파국으로 끝날 수 있으니 주위 조언을 들어라.',v:-2,it:[]},
 {m:'관재.',v:-1,it:[['H','합이면 변화 속에 문서가 들어오며 실리를 챙긴다',1],['','관재구설 — 남의 상가에 가지 말 것',-1],['','종잡을 수 없는 상황에 휩쓸리면 심신이 지친다 — 주관을 확고히',-1]]},
 {m:'문서로 새 돌파구를 찾고 밖에서 노력한 대가를 얻는다. 다만 문서상 불이익을 볼 실수를 하기 쉬우니 명심하라.',v:0,it:[['H','합이면 부동산에 투자해도 좋다',1]]}],
'53':[
 {m:'행운의 숫자 — 과감한 데서 귀신(3)이 5를 도와 재물도 따른다. 과감히 뜻을 이룬다. 다만 심리 불안으로 돌파구를 찾으며 갈등과 혼란 — 원만히 안정권을 유지하라.',v:1,it:[['','주위 여건이 동조해 재물이 뒤따른다',1]]},
 {m:'변화·변동이 좋고 관으로 성취감 — 승진·명예.',v:2,it:[['C','충이면 변화·변동이 어렵고 바라던 결과가 안 나온다',-2]]},
 {m:'귀신(귀인)의 도움으로 재물이 따르고 문서로 크게 발전. 과거 어려움에서 벗어나 뜻을 이룬다. 이성 관계가 급진전.',v:2,it:[]},
 {m:'귀인이 나서 안정 속 좋은 결과. 빨리 진전시키고 싶은 욕구가 강하나, 성급한 변동은 더 어려워지니 현 상태를 유지하며 마음을 정리하라.',v:1,it:[]}],
'54':[
 {m:'일생이 안정되어 매사 여유. 안정 속에 뜻을 이루고, 명예·승진 등 주위 도움으로 행운이 온다. 진취적으로 추진하면 이룬다.',v:2,it:[]},
 {m:'안정을 바탕으로 현실에 대처하라. 명예·지위 상승 욕구가 커지고 시도가 순조로우며 주위 상황이 분발하게 한다.',v:1,it:[]},
 {m:'안정 속 마음에 여유. 특히 문서 분야에서 성취하라. 행동에 따라 평가가 크게 갈리니 신중히, 인간관계에 신경 써라.',v:1,it:[]},
 {m:'관재구설 — 욕심 내지 않으면 염려 없다. 색다른 제안으로 변신을 꾀하나 과감히 못 하면 갈등만 깊어진다. 과묵하고 신중한 판단이 원만함을 지키는 길.',v:-1,it:[]}],
'55':[
 {m:'더 적극적으로 나서라. 혁신의 계기로 뜻을 이룬다. 그간의 태도를 반성하고 더 능률적인 방향을 찾아 의지가 새로워진다.',v:1,it:[]},
 {m:'승진·명예가 뒤따른다. 변화 속 자극을 발전으로 잇는다. 새 아이템을 구상하고 신중히 변화하면 기대 이상의 결과.',v:1,it:[]},
 {m:'해외로 나가도 좋다. 관으로 밖에서 뜻을 이룬다. 자신감이 충만해 뜻이 관철되고 명예·행운·승진도 기대된다.',v:2,it:[]},
 {m:'변화·변동해도 좋다.',v:1,it:[['D:亥','亥일생은 10월에 자형살이니 이사하지 말라',-1],['D:午未','午·未일생은 11·12월 이사가 나쁘다',-1]]}],
'56':[
 {m:'순리적으로 명예가 따른다. 학생은 시험 합격. 다만 명예에 치우치면 이미지가 상하고, 능력을 과신해 무모하면 구설과 건강 문제.',v:1,it:[]},
 {m:'건강 유념. 재물과 명예가 뒤따른다. 능력과 의욕을 발휘해 나아갈 때. 일시적 자만·허영은 금물, 겸손하게 다음을 대비하라.',v:1,it:[]},
 {m:'안주보다 적극적으로 뜻을 펴라. 그러나 변화는 금물 — 마음을 지켜 소신껏 대처하라. 건강 침체·의욕 상실 우려가 있으니 현 상태 유지.',v:0,it:[]},
 {m:'귀인이 나서 주니 재물도 확고하게 뜻을 이룬다. 미혼은 이성 만남, 생활에 활력, 새 구상이 싹튼다.',v:1,it:[]}],
'57':[
 {m:'건강 때문에 생활에 의욕이 없고 심리 불안. 벗어나 발전하려는 생각은 깊어지나, 확실한 비전 없이 변동하지 말고 현 상태를 유지하라.',v:-2,it:[]},
 {m:'서두르지 말고 계획을 검토하며 실행하라. 명예·위치가 확립되어 제자리를 잡는다. 문서 일이 많고 취업·자격 취득은 도전하라.',v:1,it:[]},
 {m:'재물이 따르고 귀인·문서로 뜻을 이룬다. 다만 보증·담보·명의 빌려주기는 큰 손실.',v:1,it:[]},
 {m:'상문살 — 상갓집 금물. 전반적 의욕 침체로 활력을 잃고 건강도 침체.',v:-2,it:[]}],
'58':[
 {m:'재물에 관심이 크다. 재물의 안정을 추구하라. 금전 욕구로 무엇이든 하려 하나 과욕으로 일을 그르치지 말라.',v:1,it:[['','아주 나쁜 돈이 될 수 있다',-1]]},
 {m:'사기나 관재구설, 교통사고 주의. 귀신 문서를 받으니 생명이 위험하거나 돈이 나간다.',v:-2,it:[]},
 {m:'관재구설 — 직장 이탈, 귀신이 발동해 재물도 쓸어 간다. 순리대로 가야 안정. 학생은 소망을 이루나 건강 주의.',v:-2,it:[]},
 {m:'재물이 들어온다. 그러나 심신의 건강 불안으로 위축되고, 명예에 치우치면 또 다른 갈등.',v:0,it:[]}],
'59':[
 {m:'아주 좋다 — 과감하게 문서로 발전의 계기. 명예·출세, 강한 의욕의 성취감. 다만 무리한 확장·변화는 자제하고 남의 의견에 가볍게 동조하지 말라.',v:2,it:[['','595는 공무원이면 국장급',1]]},
 {m:'귀인 도움으로 혁신적 변화 속에 능력이 드러난다. 다만 이성 간 헤어짐·마찰 우려 — 양보하라. 주위가 갑자기 돌변할 수 있으니 중요한 거래·새 일은 삼가라.',v:0,it:[['H','합이면 뜻을 이룬다',1]]},
 {m:'건강에 신경 쓰고 밖의 변화는 삼가라. 문서로 점차 호전된다. 서두르지 않는 여유, 확고한 실천으로 성취감.',v:0,it:[['D:寅卯','寅·卯일생은 7·8월에 깨진다',-1],['D:酉','酉일생은 매우 힘들다',-1]]},
 {m:'안정된 상태에서 변화·변동에 대비하라. 금전 갈등과 욕구 충족 심리. 욕구가 실질적 이익으로 이어질 수 있다.',v:0,it:[['','나이 많은 사람은 위험',-1],['D:午未','午·未일생은 조심',-1]]}]
});
NUM_CHAR[5]={t:'驚破 · 過激 · 固執 · 義理',d:['멋있고 박력이 있다. 잔머리를 굴리지 않고 그대로 밀어붙인다. 어떤 경우든 살려는 의지가 강하고 목표·이익에 대한 집념이 강하다.','불쌍한 사람을 돕는 동정심, 미지에 대한 도전과 모험심이 강하고 인간적인 정에 약하다.','의리가 있어 불의를 모른다. 속아서 한번 틀어지면 다시는 안 만난다. 여자가 골라야 벽제까지 따라온다.','3·5·7에는 몸이 불편한 사람이 많고, 중풍에 잘 걸린다.','단점: 냉소적·과격해 자주 충돌하고 친한 사람과도 멀어진다. 아집·고집과 충동으로 사업·직장에서 손해를 본다. 성미가 급해 타협을 못 하니 혼자 하는 개인사업을 좋아한다.','여자는 부드러운 정이 없어 집안이 썰렁하다.','대하는 법: 상대가 과격하면 돌아가라. 직선적이니 정면으로 부딪치지 말고 유연하게, 조리 있게 천천히 다뤄라.']};

Object.assign(POGUK,{
'61':[
 {m:'새 사람이 나와 도와준다 — 귀인이 나서며 새 활력을 추구한다(이성·사업 동반자). 사물의 개혁, 집 개축·이전, 직업 전환 모두 좋은 시기. 다만 3월에는 건강에 신경 써라.',v:1,it:[['','새로운 일·귀인 — 나이(세대)별로 풀어라',0]]},
 {m:'안정된 쪽에서 재물이 따르고 노력한 대가를 기대한다. 심리적 갈등도 온다. 외부 손실이 없도록 지켜야 하며, 직장·사업 소득에 욕심 내다 현 위치를 벗어나 과오를 범할 수 있으니 재물 유혹에 빠지지 마라.',v:0,it:[]},
 {m:'사람으로 인한 정신적 갈등, 건강 신경. 변화·변동은 신중히 — 도움이 안 된다. 명예는 따르나 가급적 변동하지 마라.',v:-1,it:[['C','충이면 문서·보증 서지 마라',-1],['D:子','子일주는 8월 조심',-1],['D:辰戌丑未','辰·戌·丑·未일주는 9월 조심',-1],['D:寅卯','寅·卯일생은 충으로 깨진다',-1]]},
 {m:'재물도 따르고 이성도 만난다. 사람으로 인한 변동에 재물이 들어오며 새 변화와 귀인을 만난다. 다만 이성 인연이나 주위의 여러 제의가 판단을 흐릴 수 있으니 가급적 현상 유지가 낫다.',v:1,it:[]}],
'62':[
 {m:'변화·변동으로 재물 욕구가 생기고 뜻대로 실제 행동에 옮긴다. 일시적으로 예상 못한 돈이 나가기 쉬우니 미리 대비하라. 문서·보증·담보는 가급적 자제.',v:0,it:[['','2 — 심리적 갈등',-1],['','비견은 내 편이라 돈을 벌어 가도 깨지지 않는다',0]]},
 {m:'과감한 데서 귀인이 나온다. 취업을 원하면 일자리를 얻고 시험에도 좋은 결과. 활력과 의욕이 넘쳐 기대 이상의 결과와 인연이 생긴다.',v:1,it:[['H','합이 되는 사람은 혁신적인 변화를 하라',1],['D:子丑','子·丑일생은 충',-1]]},
 {m:'건강 유념 — 밖에 나가 아프게 되니 변화하지 마라. 현 위치를 벗어나려는 욕구가 강하나 무리한 변동·확장은 하지 말고 매사 신중히 자제하라.',v:-1,it:[['C','충이면 절대 변화하지 마라',-1]]},
 {m:'안정된 상태에서 귀인이 나서 혁신적으로 돕는다. 이성의 새 만남, 과감히 현실을 박차고 큰 변혁을 한다. 다만 행동보다 논리로 확인하라 — 경솔하면 오류.',v:1,it:[]}],
'63':[
 {m:'관으로 인한 구설, 정신적 갈등. 투병 중인 사람은 모든 것이 결여된다. 반면 능력 이상의 결과(문서·명예 성취)도 가능. 자신·가족 건강 이상과 구설에 신경 쓰고, 융통성 부족으로 상대가 적이 될 수 있으니 언행 조심.',v:-1,it:[['','3 — 사업하면 망한다, 귀신(정신) 공부를 하면 액땜',-1]]},
 {m:'심리적 안정이 안 된다. 심리 갈등으로 인한 문서를 조심하라(환자는 사망 위험). 직장을 떠나고 싶고 가족 건강·심리 불안이 오기 쉽다. 너무 완벽·실리만 좇으면 주위가 거부하니 여유 있게 원만히 대처하라.',v:-2,it:[['','남의 일에 관여 말고 말조심',-1]]},
 {m:'공과 사를 명확히 구분할 때. 사적 친분이나 인정에 못 이겨 청탁을 받거나 문서 보증·담보를 제공하면 관재구설. 남의 일에 관여 말고 말조심하라.',v:-1,it:[]},
 {m:'귀신이 발동해 현실을 벗어나 외국으로, 고향을 떠나고 싶다. 활동 면에서 이익과 능률이 오르고 해외여행·폭넓은 인간관계로 답답함을 벗어나 능동적으로 변화하는 시기.',v:1,it:[['D:寅巳申亥','寅·巳·申·亥일생은 관이 깨진다',-1],['D:子午卯酉','子·午·卯·酉일생은 문서 금지 — 3이 깨진다',-1],['D:辰戌丑未','辰·戌·丑·未일생은 문서 금지 — 문서가 깨진다',-1],['','학생은 군대 보내면 좋다',0]]}],
'64':[
 {m:'안정을 바탕으로 현실을 지켜라. 귀인도 따른다. 변화는 이롭지 않으니 현 상태 고수. 이성 인연도 오니 겸허히 상대를 잘 파악하고 진행하라 — 경솔하면 갈등만 커진다.',v:1,it:[['','안정을 바탕으로 마음의 여유를 갖고 임하라',0],['','641·753은 6개월은 죽은 듯 지내라',-1]]},

'65':[

'67':[

'68':[

 {m:'변화·변동이 안정을 가져온다. 관으로 인한 재운. 가정은 이사운, 본인은 명예운, 사업가는 문서운 — 관·공기업 관련 일에 큰 발전. 남녀에게 좋은 인연.',v:2,it:[]},

NUM_CHAR[6]={t:'官 · 完璧 · 正確 · 實利',d:['6은 벼슬(官) — 관청에 나가 나랏일을 맡아 다스리는 자리. 빈틈없이 꼼꼼하고 완벽·정확하며 이치에 밝고 불의를 모른다. 하나하나 따지고 법대로 한다.','자기 뜻대로 밀고 가며 모든 일에 완벽을 기하고 스스로 합리화하는 실리형. 3·5·7처럼 앞에 나서지 않고 뒤에서 조정한다. 명예를 지니고 살며 천부적 재질이 있다.','결벽증에 가까운 완벽주의라 남에게 손해를 끼치지도, 도움을 받지도 않는다. 가정·직장에서 맡은 책임을 성실히 해 신뢰를 얻는다.','단점: 자기 앞가림만 해 폭넓게 이해하는 힘이 부족하고, 실수에 용서가 없어 맑은 물에 고기가 안 모이듯 사람이 모이지 않는다. 사람을 무시하고 드세며 과거를 들춰 꼼짝 못하게 하기도 한다.','장점: 맡은 일을 깨끗이 처리하고 미루거나 떠넘기지 않는다. 모험이나 무리한 일은 하지 않고, 남에게 피해도 신세도 지지 않는다.','역지사지의 도량과 포용심을 갖추면 사회생활의 진주가 된다.','직업: 행정·공무원·경찰·군인·법관·교수·의사·은행.']};

 S.querySelectorAll('.dbtn').forEach(b=>b.onclick=()=>easyGo('day',{y:+b.dataset.y,m:+b.dataset.mo,d:+b.dataset.d}));

 S.querySelectorAll('.ageb').forEach(b=>b.onclick=()=>{const B=ST.EB,i=+b.dataset.i,a=B.cells[i],R=B.rows[Math.floor(i/3)];const sc=cellScore(B,i);const rel=relPlain(a.gzI);
  openM(b.dataset.a+'세 대운 · '+gzK(a.gzI),'<div class="sbig">'+lt(sc)+LT_WORD[lightOf(sc)]+'</div>'+numBlock(a.num,sc)+'<div class="eb"><div class="et">이 대운과 나의 궁합</div>'+relPlain(a.gzI).html+'</div><div class="eb"><div class="et">원조 풀이</div>'+rowTexts(R)+'</div>');});}

const APP_URL='https://kmgg5694.github.io/nameanalyz/maehwa/';
function syncResult(){try{const f=JSON.stringify(cForm(),['name','sex','cal','y','m','d','t']);if(ST.lastForm!==f){run();return true;}}catch(e){}return false;}
function doShare(){syncResult();const txt=ST.shareTxt||'매화역수 운세';const url=/^https?:/.test(location.href)?location.href.split('#')[0].split('?')[0]:APP_URL;
 const full=txt+(url?'\n\n👉 내 운세도 무료로 보기\n'+url:'');
 const done=()=>alert('운세 내용을 복사했습니다.\n카카오톡 대화방에 붙여넣기(길게 누르기 → 붙여넣기) 하세요.');
 if(navigator.share){navigator.share({title:'매화역수 운세',text:full}).catch(e=>{if(!e||e.name!=='AbortError')copyText(full,done,'운세 내용 복사');});return;}
 copyText(full,done,'운세 내용 복사');}
function execCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;font-size:16px;opacity:0.01;';document.body.appendChild(ta);
 let ok=false;try{ta.focus();ta.select();ta.setSelectionRange(0,t.length);ok=document.execCommand('copy');}catch(e){ok=false;}ta.remove();try{window.getSelection().removeAllRanges();}catch(e){}return ok;}
function manualCopy(t,title){openM(title||'복사하기','<div class="stxt">아래 글자를 <b>길게 눌러 [전체 선택] → [복사]</b> 하세요.</div><textarea id="mcTxt" readonly style="width:100%;min-height:'+(t.length>80?220:70)+'px;font-size:17px;margin-top:8px;padding:10px;border:2px solid var(--navy);border-radius:10px">'+esc(t)+'</textarea><button class="btn" id="mcBtn" type="button" style="width:100%;margin-top:8px">📋 다시 복사 시도</button>');
 const el=$('mcTxt');setTimeout(()=>{try{el.focus();el.select();el.setSelectionRange(0,t.length);}catch(e){}},50);
 $('mcBtn').onclick=()=>{el.removeAttribute('readonly');el.focus();el.select();el.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}el.setAttribute('readonly','');if(ok){$('mcBtn').textContent='✅ 복사되었습니다';}else $('mcBtn').textContent='길게 눌러 직접 복사해 주세요';};}
function copyText(t,done,title){if(execCopy(t)){done();return;}
 let fin=false;const fail=()=>{if(!fin){fin=true;manualCopy(t,title);}};
 if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){const tm=setTimeout(fail,1200);navigator.clipboard.writeText(t).then(()=>{if(!fin){fin=true;clearTimeout(tm);done();}},()=>{clearTimeout(tm);fail();});}else fail();}
function fallbackCopy(t,cb){copyText(t,cb);}
function doPrint(){syncResult();const c=cForm();const cal=c.cal==='solar'?'양력':c.cal==='leap'?'음력(윤달)':'음력';const n=new Date();
 $('printHead').innerHTML='<b style="font-size:18px">'+esc(c.name||'본인')+'</b> · '+(c.sex==='M'?'남':'여')+' · '+cal+' '+c.y+'.'+c.m+'.'+c.d+' '+(c.t||'시각 모름')+'<br><small>출력일 '+n.getFullYear()+'.'+(n.getMonth()+1)+'.'+n.getDate()+' · 풍백테크 매화역수 · 상담 010-5694-7817</small>';
 document.querySelectorAll('#simple details,#out details').forEach(d=>{d.dataset.wasOpen=d.open?'1':'';d.open=true;});
 window.print();}
window.addEventListener('afterprint',()=>document.querySelectorAll('#simple details,#out details').forEach(d=>{d.open=d.dataset.wasOpen==='1';}));
$('shareBtn').onclick=doShare;
function appUrl(){return /^https?:/.test(location.href)?location.href.split('#')[0].split('?')[0]:APP_URL;}
function doCopyUrl(){const url=appUrl();if(!url){alert('아직 인터넷 주소가 없는 파일입니다.');return;}
 const done=()=>alert('주소를 복사했습니다.\n카톡·문자·블로그에 붙여넣기(길게 누르기 → 붙여넣기) 하세요.\n\n'+url);
 copyText(url,done,'앱 주소 복사');}
$('copyBtn').onclick=doCopyUrl;if(!appUrl())$('copyBtn').style.display='none';

/* ===== 일반용: 우리 가족 저장 ===== */
const FAM_KEY='mh_family_v1',FAM_MAX=5;
function famGet(){try{return JSON.parse(localStorage.getItem(FAM_KEY)||'[]');}catch(e){return [];}}
function famPut(a){try{localStorage.setItem(FAM_KEY,JSON.stringify(a));}catch(e){}}
function famRender(){const L=famGet(),el=$('famList');if(!el)return;
 if(!L.length){el.innerHTML='<div class="fempty">아래에 생년월일을 넣고 <b>[💾 저장]</b>을 누르면 여기에 이름이 생깁니다.<br>다음부터는 이름만 누르면 바로 운세가 나옵니다.</div>';return;}
 el.innerHTML=L.map((c,i)=>'<span class="fchip"><button type="button" class="fn" data-i="'+i+'">'+esc(c.name||'이름 없음')+'</button><button type="button" class="fx" data-i="'+i+'" aria-label="삭제">✕</button></span>').join('');
 el.querySelectorAll('.fn').forEach(b=>b.onclick=()=>{const c=famGet()[+b.dataset.i];if(!c)return;$('iName').value=c.name;$('iSex').value=c.sex;$('iCal').value=c.cal;$('iY').value=c.y;$('iM').value=c.m;$('iD').value=c.d;$('iTU').checked=!c.t;$('iT').disabled=!c.t;if(c.t)$('iT').value=c.t;run();});
 el.querySelectorAll('.fx').forEach(b=>b.onclick=()=>{const a=famGet(),c=a[+b.dataset.i];if(!c)return;if(!confirm((c.name||'이 사람')+' 님을 목록에서 지울까요?'))return;a.splice(+b.dataset.i,1);famPut(a);famRender();});}
function famSave(){const c=cForm();delete c.memo;if(!c.name){alert('이름을 먼저 넣어 주세요.');$('iName').focus();return;}
 const a=famGet();const k=a.findIndex(x=>x.name===c.name);
 if(k>=0){a[k]=c;famPut(a);famRender();alert(c.name+' 님 정보를 고쳐 저장했습니다.');return;}
 if(a.length>=FAM_MAX){alert('가족은 '+FAM_MAX+'명까지 저장할 수 있습니다.\n필요 없는 이름 옆 ✕를 눌러 지운 뒤 저장해 주세요.');return;}
 a.push(c);famPut(a);famRender();alert(c.name+' 님을 저장했습니다.\n다음부터는 위의 이름만 누르면 됩니다.');}
if($('fSave')){$('fSave').onclick=famSave;famRender();}
$('printBtn').onclick=doPrint;
/* ===== 소리로 듣기 ===== */
let TTS_RATE=1;try{TTS_RATE=+localStorage.getItem('mh_rate')||1;}catch(e){}
let TTS_ON=false,TTS_Q=[];
function ttsVoice(){const vs=speechSynthesis.getVoices().filter(v=>/ko/i.test(v.lang));return vs.find(v=>/google|female|yuna|heami|sunhi/i.test(v.name))||vs[0]||null;}
function ttsClean(s){return toHangul(s).replace(/\n+/g,'\u0001').replace(/⚠️/g,' 주의, ').replace(/[○●·•▶◀⟲]/g,' ').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,' ').replace(/([가-힣]+)\(\1\)/g,'$1').replace(/(\d+)~(\d+)/g,'$1에서 $2').replace(/~/g,' ').replace(/(\d+):(\d+)/g,'$1시 $2분').replace(/[ \t]+/g,' ').replace(/\u0001/g,'\n').trim();}
function ttsChunks(root){const C=root.cloneNode(true);
 C.querySelectorAll('.sbig .lt,.qrt>.lt').forEach(e=>e.remove());
 C.querySelectorAll('.lt').forEach(e=>{const w=e.classList.contains('G')?'좋음':e.classList.contains('R')?'조심':'보통';e.replaceWith(' '+w+' ');});
 C.querySelectorAll('.etabs,.enav button,#e0,.cta,.dgrid,.hint,details>summary,button.ageb small,script,style').forEach(e=>e.remove());
 C.querySelectorAll('p,div,li').forEach(e=>e.insertAdjacentText('beforebegin','\n'));
 const out=[];
 C.querySelectorAll('h2,.sbig,p,.eb>div,.qrt,.okli,.ngli,.warnli,li,.ettl,.mbtn,.hbtn,.ageb,.gdesc,.rw,.big-sum').forEach(e=>{if(e.closest('.qrt')&&!e.classList.contains('qrt'))return;const t=ttsClean(e.innerText||e.textContent);if(t)out.push(t);});
 const uniq=[];out.forEach(t=>{if(!uniq.includes(t))uniq.push(t);});
 const res=[];uniq.forEach(t=>t.split(/(?<=[.!?。])\s+|\n+/).forEach(x=>{x=x.trim();if(x)res.push(x);}));return res;}
function ttsStop(){TTS_ON=false;TTS_Q=[];try{speechSynthesis.cancel();}catch(e){}const b=$('ttsBtn');if(b){b.textContent='🔊 소리로 듣기';b.classList.remove('on');}}
function ttsNext(){if(!TTS_ON)return;const t=TTS_Q.shift();if(t==null){ttsStop();return;}
 const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=TTS_RATE;const v=ttsVoice();if(v)u.voice=v;
 u.onend=ttsNext;u.onerror=ttsNext;speechSynthesis.speak(u);}
function ttsStart(){if(typeof syncResult==='function')syncResult();if(!('speechSynthesis' in window)){alert('이 기기는 소리로 듣기를 지원하지 않습니다.');return;}
 let root;if(VIEW==='easy')root=$('simple');else{root=document.createElement('div');['bar','big','rows'].forEach(id=>{const e=$(id);if(e)root.appendChild(e.cloneNode(true));});}
 const nm=($('iName').value.trim()||'');TTS_Q=[(nm?nm+'님의 ':'')+'매화역수 풀이를 읽어 드리겠습니다.'].concat(ttsChunks(root));TTS_Q.push('풍백테크 상담 전화는 공일공, 오육구사, 칠팔일칠 입니다.');
 TTS_ON=true;speechSynthesis.cancel();const b=$('ttsBtn');b.textContent='⏹ 그만 듣기';b.classList.add('on');setTimeout(ttsNext,150);}
$('ttsBtn').onclick=()=>TTS_ON?ttsStop():ttsStart();
document.querySelectorAll('.ttsr button').forEach(b=>{b.classList.toggle('on',+b.dataset.r===TTS_RATE);b.onclick=()=>{TTS_RATE=+b.dataset.r;try{localStorage.setItem('mh_rate',TTS_RATE);}catch(e){}document.querySelectorAll('.ttsr button').forEach(x=>x.classList.toggle('on',x===b));if(TTS_ON){ttsStop();ttsStart();}};});
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}
window.addEventListener('beforeunload',()=>{try{speechSynthesis.cancel();}catch(e){}});
