<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=yes" />
  <title>김만기 이름풀이 · 연락처</title>
  <style>
    :root {
      --ink: #1a1c18;
      --paper: #f3efe6;
      --card: #fffdf8;
      --line: #d4cbb8;
      --accent: #8b3a2a;
      --accent2: #2c4a3e;
      --muted: #5c584e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e8dcc8 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #d7e3dc 0%, transparent 50%),
        var(--paper);
      line-height: 1.55;
      padding: 28px 18px 48px;
    }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand {
      font-size: clamp(1.55rem, 5.5vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 6px;
      color: var(--ink);
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(40, 30, 10, 0.06);
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent2);
    }
    .contact-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .tel {
      display: inline-block;
      margin-top: 8px;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .tel:active { opacity: 0.75; }
    .carrier {
      margin: 6px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .msg {
      margin: 0;
      color: var(--ink);
      font-size: 0.98rem;
    }
    .links {
      display: grid;
      gap: 10px;
    }
    .links a {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 14px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    .links a.primary {
      background: var(--accent2);
      border-color: var(--accent2);
      color: #fff;
    }
    .links a span {
      display: block;
      margin-top: 3px;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.8;
      word-break: break-all;
    }
    .copy-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 120px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 12px 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
    }
    button:active { transform: scale(0.98); }
    .status {
      min-height: 1.2em;
      margin: 10px 0 0;
      text-align: center;
      font-size: 0.88rem;
      color: var(--accent2);
      font-weight: 700;
    }
    footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">김만기 주역 성명학</h1>
      <p class="sub">이름풀이 · 작명 연구소</p>
    </header>

    <section class="panel" aria-label="연락처">
      <h2>연락처</h2>
      <p class="contact-name">김만기</p>
      <a class="tel" href="tel:01056947817">010-5694-7817</a>
      <p class="carrier">LGU</p>
    </section>

    <section class="panel" aria-label="안내">
      <h2>안내</h2>
      <p class="msg">자세한 이름풀이·작명의뢰는 위 번호로 연락 주세요.<br />아래 링크로 바로 이름풀이도 해 보실 수 있습니다.</p>
    </section>

    <section class="panel" aria-label="사이트">
      <h2>바로가기</h2>
      <div class="links">
        <a class="primary" href="https://kmgg5694.github.io/nameanalyz/">
          한글 이름풀이
          <span>kmgg5694.github.io/nameanalyz</span>
        </a>
        <a href="https://kmgg5694.github.io/nameanalyz/english/">
          영어 이름풀이
          <span>kmgg5694.github.io/nameanalyz/english</span>
        </a>
        <a href="https://kmgg5694.github.io/">
          전체 사이트(허브)
          <span>kmgg5694.github.io</span>
        </a>
      </div>
      <div class="copy-row">
        <button type="button" id="btnCopyAll">연락처·주소 복사</button>
        <button type="button" id="btnCopyTel">번호만 복사</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <footer>파일 하나로 저장·전송 가능 · 김만기</footer>
  </div>

  <script>
    const SHARE_TEXT =
      "김만기 주역 성명학\n" +
      "LGU 010-5694-7817 김만기\n\n" +
      "한글이름풀이\nhttps://kmgg5694.github.io/nameanalyz/\n\n" +
      "영어이름풀이\nhttps://kmgg5694.github.io/nameanalyz/english/\n\n" +
      "허브\nhttps://kmgg5694.github.io/";

    function show(msg) {
      const el = document.getElementById("status");
      el.textContent = msg;
      clearTimeout(show._t);
      show._t = setTimeout(function () { el.textContent = ""; }, 2500);
    }

    function copy(text, okMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          show(okMsg);
        }).catch(function () {
          fallback(text, okMsg);
        });
      } else {
        fallback(text, okMsg);
      }
    }

    function fallback(text, okMsg) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        show(okMsg);
      } catch (e) {
        show("복사에 실패했습니다. 길게 눌러 복사해 주세요.");
      }
      document.body.removeChild(ta);
    }

    document.getElementById("btnCopyAll").onclick = function () {
      copy(SHARE_TEXT, "연락처·주소를 복사했습니다.");
    };
    document.getElementById("btnCopyTel").onclick = function () {
      copy("010-5694-7817", "번호를 복사했습니다.");
    };
  </script>
</body>
</html>
